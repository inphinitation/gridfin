name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run --Werror

  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxtst-dev libxfixes-dev libxkbcommon-dev libwayland-dev \
            libdecor-0-dev libegl-dev libudev-dev libdbus-1-dev mesa-vulkan-drivers xvfb

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure, build and test
        run: cmake --workflow --preset ci

      - name: Smoke test on a software GPU (lavapipe)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1280x960x24" \
            ./build/native-ci/bin/Release/gridfin --frames 60 --screenshot gridfin-linux.bmp
          test -s gridfin-linux.bmp
          # The window output with the CRT and NTSC filters.
          xvfb-run -a -s "-screen 0 1280x960x24" \
            ./build/native-ci/bin/Release/gridfin --frames 60 --filter crt --ntsc --capture-display \
            --screenshot gridfin-linux-crt.bmp
          test -s gridfin-linux-crt.bmp
          # Dusk: point lights and the VDP2 colour offset.
          xvfb-run -a -s "-screen 0 1280x960x24" \
            ./build/native-ci/bin/Release/gridfin --frames 60 --dusk --screenshot gridfin-linux-dusk.bmp
          test -s gridfin-linux-dusk.bmp
          # The pond: line window, reflection layer and mirrored geometry.
          xvfb-run -a -s "-screen 0 1280x960x24" \
            ./build/native-ci/bin/Release/gridfin --frames 60 --first-person --spawn -4.5 5 0 \
            --screenshot gridfin-linux-pond.bmp
          test -s gridfin-linux-pond.bmp
          # The soundtrack, rendered offline through the SCSP model.
          ./build/native-ci/bin/Release/gridfin --render-music gridfin-music.wav 40
          test -s gridfin-music.wav

      - name: Upload screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-linux
          path: |
            gridfin-linux*.bmp
            gridfin-music.wav

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: gridfin-${{ runner.os }}
          path: build/native-ci/bin/Release/

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build
        run: |
          cmake --preset web-ci
          cmake --build --preset web-ci

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web-ci/bin/Release/

  deploy-pages:
    # Publishes the web build to GitHub Pages (enable Pages with "GitHub Actions" as the source).
    # Runs for pushes to main and for manual runs on main (Actions > CI > Run workflow).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
